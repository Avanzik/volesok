name: Update My Configs
on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect and Ping All Protocols
        run: |
          touch raw_configs.txt
          echo "1. Собираем все типы протоколов (VLESS, VMess, Trojan, Shadowsocks)..."
          
          while IFS= read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            CONTENT=$(curl -sL --connect-timeout 5 --max-time 15 "$url" || echo "")
            [ -z "$CONTENT" ] && continue
            
            if ! echo "$CONTENT" | grep -qE '(vless|vmess|trojan|ss)://'; then
              DECODED=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "")
              [ -n "$DECODED" ] && CONTENT="$DECODED"
            fi
            
            # Выдергиваем ссылки разных протоколов
            echo "$CONTENT" | grep -oE '(vless|vmess|trojan|ss)://[^[:space:]"]+' >> raw_configs.txt || true
          done < sources.txt
          
          awk 'length($0) > 20' raw_configs.txt | sort -u > clean_configs.txt
          echo "Собрано для проверки: $(wc -l < clean_configs.txt) ссылок."

          echo "2. Универсальный пинг-чекер..."
          cat << 'EOF' > checker.py
          import concurrent.futures
          import socket
          import time
          import urllib.parse

          def check_proxy(link):
              try:
                  parsed = urllib.parse.urlparse(link)
                  host = parsed.hostname
                  port = parsed.port
                  
                  if not host or not port:
                      return None, 9999

                  # Замеряем реальный TCP-пинг (время отклика сокета)
                  start_time = time.time()
                  with socket.create_connection((host, port), timeout=3.0):
                      latency = int((time.time() - start_time) * 1000)
                      return link, latency
              except:
                  return None, 9999

          with open('clean_configs.txt', 'r') as f:
              links = [line.strip() for line in f if line.strip()]

          print(f"Пингуем {len(links)} серверов...")
          valid = []
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=60) as ex:
              results = ex.map(check_proxy, links)
              for link, latency in results:
                  if link and latency < 350:  # отсеиваем те, где пинг больше 350мс
                      valid.append((link, latency))

          # Сортируем по самому быстрому пингу (как в клиенте на скрине)
          valid.sort(key=lambda x: x[1])

          # Сохраняем топ-300 самых быстрых
          with open('final_list.txt', 'w') as f:
              f.write("#profile-title: Fast_All_Protocols_Avanzik\n")
              f.write("#profile-update-interval: 6\n")
              for l, lat in valid[:300]:
                  f.write(l + '\n')
          
          print(f"Найдено живых и быстрых серверов: {len(valid)}")
          EOF

          python3 checker.py
          
          if [ -s final_list.txt ]; then
            base64 -w 76 final_list.txt > combined.txt
            echo "✅ Готово. Записано в combined.txt"
          else
            echo "❌ Рабочих серверов не найдено."
            exit 0
          fi
          
      - name: Push
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          git commit -m "Multi-protocol Ping Sort Update 🚀" || exit 0
          git push origin main
