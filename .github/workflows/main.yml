name: Update My Configs

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch and Clean Configs
        run: |
          touch raw_configs.txt
          echo "📥 Скачиваем конфиги из источников..."
          
          while IFS= read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            echo "Обработка: $url"
            
            # Скачиваем файл по ссылке
            CONTENT=$(curl -sL --connect-timeout 10 --max-time 20 "$url" || echo "")
            [ -z "$CONTENT" ] && continue
            
            # Проверяем, закодирован ли файл в base64, и если да — декодируем
            # (Проверяем отсутствие стандартных префиксов в начале текста)
            if ! echo "$CONTENT" | grep -qE '^(vless://|vmess://|trojan://|ss://|hysteria2://|tuic://)'; then
              DECODED=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "")
              if [ -n "$DECODED" ]; then
                CONTENT="$DECODED"
              fi
            fi
            
            # Добавляем в общий файл всё, что похоже на конфигурации прокси
            echo "$CONTENT" | grep -E '^(vless://|vmess://|trojan://|ss://|hysteria2://|tuic://)' >> raw_configs.txt || true
          done < sources.txt
          
          # Убираем дубликаты и пустые строки, оставляя полные конфиги со всеми хвостами
          awk 'NF' raw_configs.txt | sort -u > clean_configs.txt
          
          TOTAL_COUNT=$(wc -l < clean_configs.txt)
          echo "✅ Найдено уникальных конфигов: $TOTAL_COUNT"

          if [ "$TOTAL_COUNT" -gt 0 ]; then
            # Запаковываем итоговый файл в base64 для клиента/бота
            base64 -w 76 clean_configs.txt > combined.txt
            echo "🚀 Файл combined.txt успешно обновлен!"
          else
            echo "❌ Ошибка: не удалось собрать ни одного конфига."
            exit 1
          fi

      - name: Push updates
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          git commit -m "Update working configs without trimming 🚀" || exit 0
          git push origin main
