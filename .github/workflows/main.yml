name: Update My Configs
on:
  schedule:
    - cron: '0 */1 * * *' # Обновление каждый час
  workflow_dispatch:      # Кнопка для запуска руками

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Сборка и очистка ссылок
        run: |
          # Создаем временный файл
          touch temp.txt
          
          # Читаем ссылки из sources.txt
          while IFS= read -r url || [ -n "$url" ]; do
            if [[ $url == http* ]]; then
              echo "Скачиваю: $url"
              # Скачиваем, удаляем рекламу (#), удаляем пустые строки
              curl -sL "$url" | grep -v '^#' | sed '/^$/d' >> temp.txt
            fi
          done < sources.txt

          # Удаляем дубликаты и сохраняем в итоговый файл
          sort -u temp.txt > combined.txt
          rm temp.txt

      - name: Сохранение в репозиторий
        run: |
          git config --global user.name "CleanerBot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          git commit -m "Cleaned update: $(date)" || exit 0
          git push
