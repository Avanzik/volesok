name: Update My Configs
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Kill Dead Protocols
        run: |
          touch raw_configs.txt
          echo "1. Собираем только VLESS (Reality/Vision)..."
          
          while IFS= read -r url || [ -n "$url" ]; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            CONTENT=$(curl -sL --connect-timeout 5 --max-time 10 "$url" || echo "")
            [ -z "$CONTENT" ] && continue
            
            # Декодируем если надо
            if ! echo "$CONTENT" | grep -q 'vless://'; then
              CONTENT=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "$CONTENT")
            fi
            
            # Берем ТОЛЬКО vless
            echo "$CONTENT" | grep -oE 'vless://[^[:space:]"]+' >> raw_configs.txt || true
          done < sources.txt
          
          # Оставляем только уникальные и длинные ссылки (в Reality они всегда длинные)
          awk 'length($0) > 50' raw_configs.txt | sort -u > clean_configs.txt

          echo "2. Проверка на выживание..."
          cat << 'EOF' > checker.py
          import socket
          import concurrent.futures
          import urllib.parse

          def check_proxy(link):
              try:
                  parsed = urllib.parse.urlparse(link)
                  host = parsed.hostname
                  port = parsed.port if parsed.port else 443
                  # Пытаемся быстро соединиться
                  with socket.create_connection((host, port), timeout=2.5):
                      # Дополнительная проверка: ищем признаки Reality в ссылке
                      if "security=reality" in link.lower() or "sni=" in link.lower():
                          return link
                  return None
              except:
                  return None

          with open('clean_configs.txt', 'r') as f:
              links = f.read().splitlines()

          valid = []
          with concurrent.futures.ThreadPoolExecutor(max_workers=100) as ex:
              res = list(ex.map(check_proxy, links))
              valid = [r for r in res if r]

          # Берем топ 200 самых свежих
          with open('final_list.txt', 'w') as f:
              f.write("#profile-title: Reality_Only_Avanzik\n")
              for l in valid[:200]:
                  f.write(l + '\n')
          EOF

          python3 checker.py
          
          if [ -s final_list.txt ]; then
            base64 -w 76 final_list.txt > combined.txt
          else
            echo "Все VLESS сдохли."
            exit 0
          fi
          
      - name: Push
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          git commit -m "VLESS Reality Update 🚀" || exit 0
          git push origin main
