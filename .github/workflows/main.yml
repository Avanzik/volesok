name: Update My Configs

on:
  schedule:
    - cron: '0 */1 * * *'      # каждый час
  workflow_dispatch:           # можно запускать вручную

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Clean, Label and Encode
        run: |
          # Создаём заголовок
          cat > temp.txt << EOF
          #profile-title: Avanzik_Configs
          #profile-update-interval: 1
          #subscription-userinfo: Avanzik
          EOF

          # Скачиваем все ссылки из sources.txt и фильтруем только рабочие протоколы
          while read -r url; do
            [ -z "$url" ] && continue
            echo "Downloading from: $url"
            curl -sL --connect-timeout 10 --max-time 30 "$url" \
              | grep -E '^(vless|vmess|ss|trojan|tuic|hysteria)://' >> temp.txt || true
          done < sources.txt

          # Убираем дубликаты и кодируем в base64 (одной строкой)
          sort -u temp.txt | base64 -w 0 > combined.txt
          rm temp.txt

          echo "Combined.txt created with $(wc -l < combined.txt) characters"

      - name: Push results
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"

          # Обновляемся до актуального состояния (важно!)
          git pull --rebase origin main || true

          git add combined.txt

          # Коммитим только если есть изменения
          if ! git diff --staged --quiet; then
            git commit -m "Update configs by Avanzik-Bot [$(date '+%Y-%m-%d %H:%M')]"
            git push --force-with-lease origin main
            echo "✅ Successfully pushed new combined.txt"
          else
            echo "No changes to commit"
          fi
