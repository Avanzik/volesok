name: Update My Configs
on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Clean and Collect
        run: |
          touch temp.txt
          while read -r url; do
            [ -z "$url" ] && continue
            curl -sL "$url" | grep -E '^(vless|vmess|ss|trojan|tuic|hysteria)://' >> temp.txt
          done < sources.txt
          sort -u temp.txt > combined.txt
      - name: Push
        run: |
          git config --global user.name "bot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          git commit -m "update" || exit 0
          git push
          
