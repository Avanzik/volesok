name: Update My Configs

on:
  schedule:
    - cron: '0 */1 * * *'      # Запуск каждый час
  workflow_dispatch:           # Кнопка ручного запуска

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Process and Filter Configs
        run: |
          # Создаем временный файл для чистых ссылок
          touch raw_configs.txt

          # Читаем sources.txt и скачиваем контент
          while read -r url; do
            [ -z "$url" ] && continue
            echo "Fetching: $url"
            
            # Скачиваем, пробуем декодировать (если там base64) и фильтруем протоколы
            CONTENT=$(curl -sL --connect-timeout 10 --max-time 20 "$url")
            
            # Проверяем, не в base64 ли скачанный контент
            if [[ ! "$CONTENT" =~ ^(vless|vmess|ss|trojan|tuic|hysteria):// ]]; then
                DECODED=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "$CONTENT")
            else
                DECODED="$CONTENT"
            fi

            echo "$DECODED" | grep -E '^(vless|vmess|ss|trojan|tuic|hysteria)://' >> raw_configs.txt || true
          done < sources.txt

          # Убираем дубликаты и пустые строки
          sort -u raw_configs.txt -o raw_configs.txt

          # Формируем финальный файл с заголовками
          # Важно: для правильной работы подписки заголовки и ссылки должны быть закодированы ВМЕСТЕ
          {
            echo "#profile-title: Avanzik_Configs"
            echo "#profile-update-interval: 1"
            echo "#subscription-userinfo: Avanzik"
            cat raw_configs.txt
          } > final_list.txt

          # Кодируем всё в Base64 (одной строкой)
          base64 -w 0 final_list.txt > combined.txt
          
          echo "Done! Final file size: $(stat -c%s combined.txt) bytes"
          rm raw_configs.txt final_list.txt

      - name: Push results
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"

          git add combined.txt
          
          # Проверяем наличие изменений перед коммитом
          if ! git diff --staged --quiet; then
            git commit -m "Update configs: $(date '+%Y-%m-%d %H:%M')"
            git push origin main
            echo "✅ Combined.txt updated and pushed."
          else
            echo "No changes detected."
          fi
