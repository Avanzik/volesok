name: Update My Configs
on:
  schedule:
    - cron: '*/30 * * * *' # Запуск каждые 30 минут
  workflow_dispatch: # Кнопка ручного запуска
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Process and Filter Configs
        run: |
          touch raw_configs.txt
          
          # Читаем sources.txt (построчно)
          while IFS= read -r url || [ -n "$url" ]; do
            # Пропускаем пустые строки и комментарии (начинающиеся с #)
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            
            echo "Fetching: $url"
            
            # Скачиваем с жестким таймаутом. Если ошибка - не падаем, просто идем дальше
            CONTENT=$(curl -sL --connect-timeout 5 --max-time 15 "$url" || echo "")
            
            # Если ничего не скачалось, пропускаем
            if [ -z "$CONTENT" ]; then
              echo "⚠️ Failed to fetch or empty content from $url"
              continue
            fi
            
            # Проверяем, есть ли явные протоколы. Если нет - пробуем декодировать из base64
            if ! echo "$CONTENT" | grep -qE '^(vless|vmess|ss|trojan|tuic|hysteria|hysteria2|hy2)://'; then
              CONTENT=$(echo "$CONTENT" | base64 -d 2>/dev/null || echo "$CONTENT")
            fi
            
            # Извлекаем ТОЛЬКО валидные ссылки нужных форматов до первого пробела или кавычки
            echo "$CONTENT" | grep -oE '(vless|vmess|ss|trojan|tuic|hysteria|hysteria2|hy2)://[^[:space:]"]+' >> raw_configs.txt || true
          done < sources.txt
          
          # Очищаем от дубликатов. 
          # Плюс awk оставляет только строки длиннее 15 символов (отсев мусора).
          awk 'length($0) > 15' raw_configs.txt | sort -u > clean_configs.txt
          
          COUNT=$(wc -l < clean_configs.txt)
          echo "✅ Total unique valid configs: $COUNT"
          
          # Защита от затирания файла, если все источники упали
          if [ "$COUNT" -eq 0 ]; then
            echo "❌ No valid configs found! Keeping old file and exiting."
            exit 0
          fi
          
          # Формируем финальный файл с заголовками
          {
            echo "#profile-title: Avanzik_Configs"
            echo "#profile-update-interval: 1"
            echo "#subscription-userinfo: Avanzik"
            cat clean_configs.txt
          } > final_list.txt
          
          # Кодируем всё в Base64 (с разбиением на строки по 76 символов)
          base64 -w 76 final_list.txt > combined.txt
          echo "Done! Final file size: $(stat -c%s combined.txt) bytes"
          
          # Убираем временные файлы
          rm raw_configs.txt clean_configs.txt final_list.txt
          
      - name: Push results
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          
          # Проверяем наличие изменений перед коммитом
          if ! git diff --staged --quiet; then
            git commit -m "Update configs: $(date '+%Y-%m-%d %H:%M') | Total: $COUNT"
            git push origin main
            echo "✅ Combined.txt updated and pushed."
          else
            echo "No changes detected. Nothing to push."
          fi
