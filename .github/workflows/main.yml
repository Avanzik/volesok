name: Update My Configs
on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Clean, Label and Encode
        run: |
          # Создаем заголовок с твоим именем
          echo "#profile-title: Avanzik_Configs" > temp.txt
          echo "#profile-update-interval: 1" >> temp.txt
          echo "#subscription-userinfo: Avanzik" >> temp.txt
          
          # Скачиваем ссылки из sources.txt, фильтруем только ключи и добавляем в файл
          while read -r url; do
            [ -z "$url" ] && continue
            curl -sL "$url" | grep -E '^(vless|vmess|ss|trojan|tuic|hysteria)://' >> temp.txt
          done < sources.txt
          
          # Удаляем дубликаты, сохраняя заголовок, и шифруем в Base64
          # (Приложения поймут заголовок даже внутри Base64)
          base64 -w 0 temp.txt > combined.txt
          rm temp.txt

      - name: Push results
        run: |
          git config --global user.name "Avanzik-Bot"
          git config --global user.email "bot@github.com"
          git add combined.txt
          git commit -m "Update by Avanzik" || exit 0
          git push --force
          
